<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>机器人大战</title>
  <style>
    /* ============ 页面整体样式 ============ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      /* 页面背景用浅色，突出浅绿色的游戏区域 */
      background: #eef3e6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    }

    /* 包裹层：用于让覆盖层(开始/结束界面)和画布精确对齐 */
    #wrap {
      position: relative;
      display: inline-block;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      overflow: hidden;
    }

    /* 游戏画布，小屏幕时按比例缩放 */
    canvas {
      display: block;
      max-width: 96vw;
      height: auto;
      background: #d7ecd0; /* 浅绿色地面 */
    }

    /* ============ 覆盖层（开始界面 / 结束界面） ============ */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(30, 50, 30, 0.82); /* 半透明深绿背景 */
      color: #fff;
      text-align: center;
      padding: 24px;
    }

    .overlay.hidden {
      display: none; /* 隐藏 */
    }

    .overlay h1 {
      font-size: 42px;
      margin-bottom: 16px;
      letter-spacing: 4px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .overlay .rules {
      text-align: left;
      max-width: 560px;
      font-size: 16px;
      line-height: 2;
      margin-bottom: 24px;
      background: rgba(0, 0, 0, 0.2);
      padding: 16px 24px;
      border-radius: 8px;
    }

    .overlay .rules li {
      list-style: none;
    }

    /* 难度选择 */
    .overlay .difficulty {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 20px;
      font-size: 18px;
    }
    .overlay .diff-label {
      color: #fff;
    }
    .overlay .diff-opt {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .overlay .diff-opt input {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #e53935;
    }

    .overlay button {
      font-size: 20px;
      padding: 12px 40px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #e53935; /* 红色按钮，呼应血条 */
      color: #fff;
      letter-spacing: 2px;
      box-shadow: 0 3px 0 #a02724;
      transition: transform 0.06s ease;
    }

    .overlay button:hover {
      background: #ef5350;
    }

    .overlay button:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #a02724;
    }

    /* 结束界面按钮布局 */
    .end-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .end-buttons button.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <!-- 游戏画布，尺寸由 JS 根据地图大小决定 -->
    <canvas id="game"></canvas>

    <!-- 开始界面 -->
    <div id="menu" class="overlay">
      <h1>🤖 机器人大战 🤖</h1>
      <ul class="rules">
        <li>🎮 移动：<b>方向键</b> 或 <b>W A S D</b></li>
        <li>💥 射击：<b>空格键</b> 或 <b>J</b>（朝面朝方向发射）</li>
        <li>🎯 目标：击败 <b>两辆</b> 敌方机器人</li>
        <li>❤️ 你的机器人（白色圆环）有 <b>5 点</b>生命，敌方机器人各有 <b>3 点</b>生命</li>
        <li>🧱 机器人不能穿墙；炮弹碰到墙会直接消失</li>
        <li>⚙️ 三台机器人性能完全相同，公平对决</li>
      </ul>
      <div class="difficulty">
        <span class="diff-label">难度选择：</span>
        <label class="diff-opt"><input type="radio" name="diff" value="easy" checked> 简单</label>
        <label class="diff-opt"><input type="radio" name="diff" value="hard"> 超级困难</label>
      </div>
      <button id="startBtn">开始游戏</button>
    </div>

    <!-- 结束界面 -->
    <div id="end" class="overlay hidden">
      <h1 id="endTitle"></h1>
      <p id="endMsg" style="font-size:18px;margin-bottom:24px;"></p>
      <div class="end-buttons">
        <button id="restartBtn">再来一局</button>
        <button id="surrenderBtn" class="hidden">认输，切换简单难度</button>
        <button id="challengeBtn" class="hidden">挑战超级困难</button>
        <button id="menuBtn">返回主界面</button>
      </div>
    </div>
  </div>

  <script>
    /* ============================================================
     * 机器人大战 —— 单文件 2D 俯视角射击游戏
     * 核心结构：迷宫生成 -> 机器人(随机游走 + 视线开火) -> 炮弹 -> 碰撞
     * ============================================================ */

    // ============ 一、基础配置常量 ============
    const TILE = 40;              // 每个格子的像素尺寸
    const CW = 10;                // 迷宫横向“单元格”数（对应生成 2*CW+1 = 21 格）
    const CH = 7;                 // 迷宫纵向“单元格”数（对应生成 2*CH+1 = 15 格）
    const MAP_W = CW * 2 + 1;     // 地图格子宽 21
    const MAP_H = CH * 2 + 1;     // 地图格子高 15
    const HUD_H = 44;             // 顶部信息条高度(像素)

    const ROBOT_R = 13;           // 机器人碰撞半径
    const BULLET_R = 5;           // 炮弹碰撞半径
    const PLAYER_SPEED = 220;     // 玩家移动速度（像素/秒）
    const ENEMY_SPEED = 150;      // 敌方移动速度（像素/秒）
    const BULLET_SPEED = 380;     // 炮弹飞行速度（像素/秒）
    const PLAYER_SHOOT_CD = 0.4;  // 玩家射击冷却时间（秒），防止按住空格无限连发
    const ENEMY_SHOOT_CD = 1.2;   // 敌方射击冷却时间（秒）—— 简单难度
    const ENEMY_SHOOT_CD_HARD = 0.5; // 敌方射击冷却时间（秒）—— 超级困难难度
    const PLAYER_MAX_HP = 5;      // 玩家最大生命值
    const ENEMY_MAX_HP = 3;       // 敌方最大生命值

    // 视觉配色（简单清晰：浅绿地面 / 深绿障碍 / 黑色机器人 / 红色血条）
    const COLOR = {
      floor: '#d7ecd0',   // 地面：浅绿
      wall: '#3b7a3f',    // 障碍物：深绿
      wallEdge: '#2f5f33',// 障碍物描边：更深的绿
      robot: '#111111',   // 机器人身体：黑色
      barrel: '#666666',  // 炮管方向指示：灰色
      playerRing: '#ffffff', // 玩家标识：白色圆环
      enemyRing: '#b71c1c',  // 敌方标识：暗红圆环
      hpBg: '#222222',       // 血条背景：深色
      hp: '#e53935',         // 血条：红色
      bulletPlayer: '#111111', // 玩家炮弹：黑色
      bulletEnemy: '#e53935',  // 敌方炮弹：红色
      hud: '#3b7a3f',          // 顶部信息条背景
      hudText: '#ffffff'       // 顶部信息条文字
    };

    // ============ 二、获取画布与上下文 ============
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    canvas.width = MAP_W * TILE;              // 840
    canvas.height = MAP_H * TILE + HUD_H;     // 600 + 44 = 644

    // ============ 三、全局游戏状态 ============
    let state = 'menu';      // 游戏状态：menu / playing / win / lose
    let difficulty = 'easy'; // 难度：'easy'（简单）或 'hard'（超级困难）
    let wallGrid = [];       // 二维数组，true=墙，false=空地
    let walls = [];          // 所有墙的矩形（像素坐标），用于碰撞检测
    let player = null;       // 玩家机器人对象
    let enemies = [];        // 敌方机器人数组（共 2 辆）
    let bullets = [];        // 场上所有炮弹
    const keys = {};         // 当前按下的键

    // ============ 四、工具函数：坐标换算 ============
    // 把“格子坐标”转换成“像素坐标”（地图区域向下偏移了 HUD_H 的高度）
    function tileCenter(tx, ty) {
      return {
        x: tx * TILE + TILE / 2,
        y: HUD_H + ty * TILE + TILE / 2
      };
    }

    // 圆与矩形的碰撞检测（用于机器人/炮弹撞墙）
    function circleRect(cx, cy, r, rx, ry, rw, rh) {
      const nx = Math.max(rx, Math.min(cx, rx + rw)); // 矩形上离圆心最近的点 x
      const ny = Math.max(ry, Math.min(cy, ry + rh)); // 矩形上离圆心最近的点 y
      const dx = cx - nx;
      const dy = cy - ny;
      return dx * dx + dy * dy < r * r;
    }

    // 两个点之间的平方距离（避免开根号，性能更好）
    function dist2(ax, ay, bx, by) {
      const dx = ax - bx, dy = ay - by;
      return dx * dx + dy * dy;
    }

    // ============ 五、迷宫生成（递归回溯法 + 消除死路） ============
    function generateMaze() {
      // 先把整张地图全部设为墙(true)
      const grid = [];
      for (let y = 0; y < MAP_H; y++) {
        const row = [];
        for (let x = 0; x < MAP_W; x++) row.push(true);
        grid.push(row);
      }

      // visited：标记每个“单元格”是否访问过（单元格尺寸 = 2x2 格子）
      const visited = [];
      for (let y = 0; y < CH; y++) visited.push(new Array(CW).fill(false));

      // 四个方向（在单元格坐标系中移动一步）
      const dirs = [
        { dx: 1, dy: 0 }, { dx: -1, dy: 0 }, { dx: 0, dy: 1 }, { dx: 0, dy: -1 }
      ];

      // 递归回溯法（用栈实现 DFS），从 (0,0) 单元格开始挖走廊
      const stack = [[0, 0]];
      visited[0][0] = true;
      grid[1][1] = false; // 起点单元格对应的格子 (1,1) 挖空

      while (stack.length > 0) {
        const [cx, cy] = stack[stack.length - 1]; // 栈顶单元格

        // 收集所有未访问的邻居
        const neighbors = [];
        for (const d of dirs) {
          const nx = cx + d.dx, ny = cy + d.dy;
          if (nx >= 0 && nx < CW && ny >= 0 && ny < CH && !visited[ny][nx]) {
            neighbors.push([nx, ny, d.dx, d.dy]);
          }
        }

        // 没有可走邻居则回溯
        if (neighbors.length === 0) {
          stack.pop();
          continue;
        }

        // 随机选一个邻居，挖掉中间的墙和邻居格子
        const pick = neighbors[Math.floor(Math.random() * neighbors.length)];
        const [nx, ny, dx, dy] = pick;
        grid[cy * 2 + 1 + dy][cx * 2 + 1 + dx] = false; // 两个单元格之间的墙
        grid[ny * 2 + 1][nx * 2 + 1] = false;           // 邻居单元格
        visited[ny][nx] = true;
        stack.push([nx, ny]);
      }

      // 消除所有死路：让每个可达区域至少有两条出路，路线更开阔
      removeDeadEnds(grid);
      // 再安全地打通部分内墙，增加环路（只打通“两侧都是空地”的墙，不会产生新死路）
      openExtraWalls(grid, 0.12);

      return grid;
    }

    // 统计某个格子四个方向上有几个空地邻居
    function countOpenNeighbors(grid, x, y) {
      let n = 0;
      if (y > 0 && !grid[y - 1][x]) n++;
      if (y < MAP_H - 1 && !grid[y + 1][x]) n++;
      if (x > 0 && !grid[y][x - 1]) n++;
      if (x < MAP_W - 1 && !grid[y][x + 1]) n++;
      return n;
    }

    // 给死路格子打通一个相邻内墙（不碰外边界），返回是否成功打通
    function openOneWallNeighbor(grid, x, y) {
      const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      const candidates = [];
      for (const [dx, dy] of dirs) {
        const nx = x + dx, ny = y + dy;
        if (nx <= 0 || nx >= MAP_W - 1 || ny <= 0 || ny >= MAP_H - 1) continue; // 不碰外边界
        if (grid[ny][nx]) candidates.push([nx, ny]); // 相邻的墙
      }
      if (candidates.length === 0) return false;
      const pick = candidates[Math.floor(Math.random() * candidates.length)];
      grid[pick[1]][pick[0]] = false;
      return true;
    }

    // 反复消除死路，直到迷宫中没有“只有一个出口”的格子
    function removeDeadEnds(grid) {
      let changed = true;
      while (changed) {
        changed = false;
        for (let y = 1; y < MAP_H - 1; y++) {
          for (let x = 1; x < MAP_W - 1; x++) {
            if (grid[y][x]) continue;                        // 只看空地
            if (countOpenNeighbors(grid, x, y) !== 1) continue; // 不是死路就跳过
            if (openOneWallNeighbor(grid, x, y)) changed = true; // 打通第二个出口
          }
        }
      }
    }

    // 安全地额外打通部分内墙，增加环路让路线更开阔（只打通两侧都是空地的墙）
    function openExtraWalls(grid, prob) {
      for (let y = 1; y < MAP_H - 1; y++) {
        for (let x = 1; x < MAP_W - 1; x++) {
          if (grid[y][x] && countOpenNeighbors(grid, x, y) >= 2 && Math.random() < prob) {
            grid[y][x] = false;
          }
        }
      }
    }

    // 根据墙格子数组，生成用于碰撞检测的矩形列表（像素坐标）
    function buildWalls() {
      const rects = [];
      for (let y = 0; y < MAP_H; y++) {
        for (let x = 0; x < MAP_W; x++) {
          if (wallGrid[y][x]) {
            rects.push({
              x: x * TILE,
              y: HUD_H + y * TILE,
              w: TILE,
              h: TILE
            });
          }
        }
      }
      return rects;
    }

    // ============ 六、视线检测（敌人是否“看到”玩家） ============
    // 从 (x1,y1) 到 (x2,y2) 的直线是否被墙挡住（像素坐标，沿途采样判断）
    function hasLineOfSight(x1, y1, x2, y2) {
      const steps = Math.ceil(Math.hypot(x2 - x1, y2 - y1) / (TILE / 2));
      for (let i = 1; i < steps; i++) {
        const t = i / steps;
        const x = x1 + (x2 - x1) * t;
        const y = y1 + (y2 - y1) * t;
        const tx = Math.floor(x / TILE);
        const ty = Math.floor((y - HUD_H) / TILE);
        if (tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) return false;
        if (wallGrid[ty][tx]) return false; // 途中经过墙，说明看不到
      }
      return true;
    }

    // ============ 七、机器人 / 炮弹 相关 ============
    // 创建一个机器人对象
    function makeRobot(tx, ty, maxHp, kind) {
      const c = tileCenter(tx, ty);
      return {
        x: c.x,
        y: c.y,
        r: ROBOT_R,
        hp: maxHp,
        maxHp: maxHp,
        facing: 0,        // 朝向（弧度，0 表示朝右）
        kind: kind,       // 'player' 或 'enemy'
        shootCd: 0,       // 射击冷却计时器
        sawPlayer: false, // 上一帧是否看到玩家（用于超级困难的“看到立刻开火”）
        moveDx: 0,        // 敌方随机游走的当前移动方向 x
        moveDy: 0,        // 敌方随机游走的当前移动方向 y
        moveTimer: 0      // 敌方换方向的倒计时
      };
    }

    // 分轴移动机器人：分别尝试 X、Y 轴位移，撞墙就撤销该轴，实现“贴墙滑动”
    function moveRobot(r, dx, dy) {
      r.x += dx;
      if (robotHitsWall(r)) r.x -= dx;
      r.y += dy;
      if (robotHitsWall(r)) r.y -= dy;

      // 限制在地图范围内（正常情况有边界墙，不会越界）
      r.x = Math.max(r.r, Math.min(MAP_W * TILE - r.r, r.x));
      r.y = Math.max(HUD_H + r.r, Math.min(HUD_H + MAP_H * TILE - r.r, r.y));
    }

    // 机器人是否撞到任意墙
    function robotHitsWall(r) {
      for (const w of walls) {
        if (circleRect(r.x, r.y, r.r, w.x, w.y, w.w, w.h)) return true;
      }
      return false;
    }

    // 发射一枚炮弹：owner 表示是谁射出的（'player' 或 'enemy'）
    function shoot(shooter, targetX, targetY, owner) {
      const dx = targetX - shooter.x;
      const dy = targetY - shooter.y;
      const d = Math.hypot(dx, dy) || 1; // 避免除零
      const vx = (dx / d) * BULLET_SPEED;
      const vy = (dy / d) * BULLET_SPEED;

      // 炮弹从机器人边缘出生，避免刚生成就撞到自己
      const sx = shooter.x + (dx / d) * (shooter.r + BULLET_R + 2);
      const sy = shooter.y + (dy / d) * (shooter.r + BULLET_R + 2);

      bullets.push({
        x: sx,
        y: sy,
        vx: vx,
        vy: vy,
        r: BULLET_R,
        owner: owner,
        dead: false
      });
    }

    // ============ 八、游戏逻辑：初始化 / 更新 ============
    // 重置并开始新一局
    function resetGame() {
      wallGrid = generateMaze(); // 生成新迷宫
      walls = buildWalls();      // 构建墙矩形
      bullets = [];

      // 玩家出生在左上角 (1,1)，这是迷宫生成时必定挖空的起点
      player = makeRobot(1, 1, PLAYER_MAX_HP, 'player');

      // 收集所有空地，选两个离玩家出生点(1,1)最远的格子作为敌人出生点
      const floorTiles = [];
      for (let y = 0; y < MAP_H; y++) {
        for (let x = 0; x < MAP_W; x++) {
          if (!wallGrid[y][x] && !(x === 1 && y === 1)) {
            floorTiles.push({ x, y });
          }
        }
      }
      // 按到玩家出生点的曼哈顿距离从远到近排序
      floorTiles.sort((a, b) =>
        (Math.abs(b.x - 1) + Math.abs(b.y - 1)) - (Math.abs(a.x - 1) + Math.abs(a.y - 1))
      );

      enemies = [
        makeRobot(floorTiles[0].x, floorTiles[0].y, ENEMY_MAX_HP, 'enemy'),
        makeRobot(floorTiles[1].x, floorTiles[1].y, ENEMY_MAX_HP, 'enemy')
      ];
    }

    // 每帧更新游戏逻辑
    function update(dt) {
      updatePlayer(dt);   // 玩家移动与射击
      updateEnemies(dt);  // 敌方 AI（寻路移动 + 自动射击）
      updateBullets(dt);  // 炮弹飞行与碰撞

      // 胜负判定
      const alive = enemies.filter(e => e.hp > 0).length;
      if (alive === 0) {
        endGame(true);
      } else if (player.hp <= 0) {
        endGame(false);
      }
    }

    // 玩家：读键盘 -> 移动 / 射击
    function updatePlayer(dt) {
      // 读取移动方向
      let dx = 0, dy = 0;
      if (keys['arrowup'] || keys['w']) dy -= 1;
      if (keys['arrowdown'] || keys['s']) dy += 1;
      if (keys['arrowleft'] || keys['a']) dx -= 1;
      if (keys['arrowright'] || keys['d']) dx += 1;

      // 归一化（斜向移动不加速）
      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        dx /= len;
        dy /= len;
        moveRobot(player, dx * PLAYER_SPEED * dt, dy * PLAYER_SPEED * dt);
        player.facing = Math.atan2(dy, dx); // 记录朝向（用于射击方向）
      }

      // 射击（空格 或 J），受冷却限制
      player.shootCd -= dt;
      if ((keys[' '] || keys['j']) && player.shootCd <= 0) {
        player.shootCd = PLAYER_SHOOT_CD;
        shoot(
          player,
          player.x + Math.cos(player.facing) * 10, // 朝面朝方向的一个点
          player.y + Math.sin(player.facing) * 10,
          'player'
        );
      }
    }

    // 敌方 AI（简化版）：在空旷处随机游走，看到玩家就开火
    function updateEnemies(dt) {
      for (const e of enemies) {
        if (e.hp <= 0) continue; // 已阵亡的敌人不再行动

        // 炮管始终指向玩家，视觉上更合理
        e.facing = Math.atan2(player.y - e.y, player.x - e.x);

        // —— 自动射击：冷却结束，且能看到玩家时才开火 ——
        e.shootCd -= dt;
        const dToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
        // 是否能看到玩家（在射程内且视线无遮挡）
        const canSee = dToPlayer < 500 && hasLineOfSight(e.x, e.y, player.x, player.y);

        if (difficulty === 'hard') {
          // 超级困难：每 0.5 秒一发，并且刚看到玩家的瞬间立刻发射
          if (canSee && (e.shootCd <= 0 || !e.sawPlayer)) {
            e.shootCd = ENEMY_SHOOT_CD_HARD;
            shoot(e, player.x, player.y, 'enemy');
          }
        } else {
          // 简单难度：维持原版逻辑（1.2 秒 + 随机 0~0.3 秒冷却）
          if (canSee && e.shootCd <= 0) {
            e.shootCd = ENEMY_SHOOT_CD + Math.random() * 0.3;
            shoot(e, player.x, player.y, 'enemy');
          }
        }
        e.sawPlayer = canSee; // 记录本帧视线状态，供“看到立刻开火”判断

        // —— 移动：随机游走，走一段换一个方向；被墙卡住就立刻换方向 ——
        const prevX = e.x, prevY = e.y;

        e.moveTimer -= dt;
        if (e.moveTimer <= 0) {
          e.moveTimer = 0.6 + Math.random() * 1.0; // 每 0.6~1.6 秒随机换一次方向
          const ang = Math.random() * Math.PI * 2;
          e.moveDx = Math.cos(ang);
          e.moveDy = Math.sin(ang);
        }

        moveRobot(e, e.moveDx * ENEMY_SPEED * dt, e.moveDy * ENEMY_SPEED * dt);

        // 这一帧几乎没动说明撞墙了，重置计时器，下一帧立刻换方向
        if (Math.hypot(e.x - prevX, e.y - prevY) < ENEMY_SPEED * dt * 0.3) {
          e.moveTimer = 0;
        }
      }
    }

    // 炮弹：飞行、撞墙消失、命中目标扣血
    function updateBullets(dt) {
      for (const b of bullets) {
        if (b.dead) continue;

        // 前进
        b.x += b.vx * dt;
        b.y += b.vy * dt;

        // 飞出地图边界 -> 消失
        if (
          b.x < b.r || b.x > MAP_W * TILE - b.r ||
          b.y < HUD_H + b.r || b.y > HUD_H + MAP_H * TILE - b.r
        ) {
          b.dead = true;
          continue;
        }

        // 撞墙 -> 直接消失（不反弹）
        let hitWall = false;
        for (const w of walls) {
          if (circleRect(b.x, b.y, b.r, w.x, w.y, w.w, w.h)) {
            hitWall = true;
            break;
          }
        }
        if (hitWall) {
          b.dead = true;
          continue;
        }

        // 命中目标：玩家炮弹只打敌人，敌方炮弹只打玩家
        if (b.owner === 'player') {
          for (const e of enemies) {
            if (e.hp > 0 && dist2(b.x, b.y, e.x, e.y) < (b.r + e.r) * (b.r + e.r)) {
              e.hp -= 1;
              b.dead = true;
              break;
            }
          }
        } else {
          if (player.hp > 0 && dist2(b.x, b.y, player.x, player.y) < (b.r + player.r) * (b.r + player.r)) {
            player.hp -= 1;
            b.dead = true;
          }
        }
      }

      // 清掉已标记消失的炮弹
      bullets = bullets.filter(b => !b.dead);
    }

    // 游戏结束：切换状态并显示结束界面（按难度和胜负显示不同按钮）
    function endGame(win) {
      state = win ? 'win' : 'lose';
      document.getElementById('endTitle').textContent = win ? '🎉 你赢了！' : '💀 你输了……';
      document.getElementById('endMsg').textContent = win
        ? '成功击败了所有敌方机器人！'
        : '你的机器人被击毁了，再接再厉！';

      // 根据难度和胜负，决定显示哪些按钮
      const surrenderBtn = document.getElementById('surrenderBtn');
      const challengeBtn = document.getElementById('challengeBtn');
      // “认输切换简单难度”：仅超级困难失败时显示
      surrenderBtn.classList.toggle('hidden', !(difficulty === 'hard' && !win));
      // “挑战超级困难”：仅简单难度胜利时显示
      challengeBtn.classList.toggle('hidden', !(difficulty === 'easy' && win));

      document.getElementById('end').classList.remove('hidden');
    }

    // ============ 九、渲染 ============
    function render() {
      // 1) 清空画布，铺满浅绿色地面
      ctx.fillStyle = COLOR.floor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2) 绘制障碍物（深绿色方块）
      for (const w of walls) {
        ctx.fillStyle = COLOR.wall;
        ctx.fillRect(w.x, w.y, w.w, w.h);
        ctx.strokeStyle = COLOR.wallEdge;
        ctx.lineWidth = 2;
        ctx.strokeRect(w.x + 1, w.y + 1, w.w - 2, w.h - 2);
      }

      // 3) 绘制炮弹
      for (const b of bullets) {
        ctx.fillStyle = b.owner === 'player' ? COLOR.bulletPlayer : COLOR.bulletEnemy;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        // 加一圈白边，在深色障碍上更清晰
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      // 4) 绘制机器人（先画敌人，再画玩家，让玩家显示在最上层）
      for (const e of enemies) {
        if (e.hp > 0) drawRobot(e);
      }
      if (player.hp > 0) drawRobot(player);

      // 5) 绘制顶部信息条（血量 / 剩余敌人 / 操作提示）
      drawHUD();
    }

    // 画单个机器人（黑色圆形身体 + 炮管 + 血条 + 身份圆环）
    function drawRobot(r) {
      // 身体（黑色圆）
      ctx.fillStyle = COLOR.robot;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.fill();

      // 炮管：从圆心朝面朝方向伸出的灰色矩形，用于指示朝向
      ctx.save();
      ctx.translate(r.x, r.y);
      ctx.rotate(r.facing);
      ctx.fillStyle = COLOR.barrel;
      ctx.fillRect(0, -3, r.r + 5, 6);
      ctx.restore();

      // 身份圆环：玩家白色，敌方暗红，方便区分
      ctx.strokeStyle = r.kind === 'player' ? COLOR.playerRing : COLOR.enemyRing;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r + 3, 0, Math.PI * 2);
      ctx.stroke();

      // 血条（红色）
      drawHpBar(r.x, r.y, r.hp, r.maxHp, r.r);
    }

    // 在机器人头顶画红色血条
    function drawHpBar(x, y, hp, maxHp, r) {
      const w = maxHp * 8;           // 宽度与最大生命值成正比（玩家更长）
      const h = 6;
      const bx = x - w / 2;
      const by = y - r - 14;

      // 深色底
      ctx.fillStyle = COLOR.hpBg;
      ctx.fillRect(bx, by, w, h);
      // 红色血量（按比例）
      ctx.fillStyle = COLOR.hp;
      const fill = Math.max(0, hp / maxHp);
      ctx.fillRect(bx + 1, by + 1, (w - 2) * fill, h - 2);
    }

    // 顶部信息条
    function drawHUD() {
      ctx.fillStyle = COLOR.hud;
      ctx.fillRect(0, 0, canvas.width, HUD_H);
      ctx.strokeStyle = COLOR.wallEdge;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, HUD_H);
      ctx.lineTo(canvas.width, HUD_H);
      ctx.stroke();

      ctx.fillStyle = COLOR.hudText;
      ctx.font = 'bold 18px "Microsoft YaHei", sans-serif';
      ctx.textBaseline = 'middle';

      const alive = enemies.filter(e => e.hp > 0).length;
      ctx.fillText(`我的血量：${Math.max(0, player.hp)} / ${player.maxHp}`, 14, HUD_H / 2);
      ctx.fillText(`剩余敌人：${alive}`, 230, HUD_H / 2);
      ctx.fillText(`难度：${difficulty === 'hard' ? '超级困难' : '简单'}`, 360, HUD_H / 2);

      // 右侧操作提示（小字）
      ctx.font = '14px "Microsoft YaHei", sans-serif';
      ctx.fillText('移动：方向键/WASD　射击：空格/J', canvas.width - 250, HUD_H / 2);
    }

    // ============ 十、键盘输入 ============
    window.addEventListener('keydown', (e) => {
      // 阻止方向键和空格滚动页面
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }
      keys[e.key] = true;                 // 存原始值
      keys[e.key.toLowerCase()] = true;   // 存小写值（统一匹配 w/a/s/d 等）
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
      keys[e.key.toLowerCase()] = false;
    });

    // ============ 十一、主循环 ============
    let last = performance.now();
    function frame(now) {
      // 计算帧间隔，限制最大 0.05 秒，避免切后台后大幅跳帧
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;

      if (state === 'playing') update(dt);
      render();

      requestAnimationFrame(frame);
    }

    // ============ 十二、按钮事件 ============
    // 以指定难度开始一局：切换难度 + 隐藏界面 + 重置 + 进入游戏
    function startGame(diff) {
      difficulty = diff;
      document.getElementById('menu').classList.add('hidden');
      document.getElementById('end').classList.add('hidden');
      resetGame();          // 重新生成迷宫并放置机器人
      state = 'playing';
    }

    document.getElementById('startBtn').addEventListener('click', () => {
      // 读取玩家在开始界面选择的难度并开始游戏
      startGame(document.querySelector('input[name="diff"]:checked').value);
    });

    // 再来一局：沿用当前难度
    document.getElementById('restartBtn').addEventListener('click', () => {
      startGame(difficulty);
    });

    // 认输：超级困难失败后，切换到简单难度重新开始
    document.getElementById('surrenderBtn').addEventListener('click', () => {
      startGame('easy');
    });

    // 简单难度通关后，挑战超级困难
    document.getElementById('challengeBtn').addEventListener('click', () => {
      startGame('hard');
    });

    // 返回主界面（可重新选择难度）
    document.getElementById('menuBtn').addEventListener('click', () => {
      document.getElementById('end').classList.add('hidden');
      // 把难度单选框切到当前难度
      const radio = document.querySelector(`input[name="diff"][value="${difficulty}"]`);
      if (radio) radio.checked = true;
      resetGame(); // 重新生成一局作为主界面背景
      document.getElementById('menu').classList.remove('hidden');
      state = 'menu';
    });

    // ============ 十三、启动游戏 ============
    resetGame();       // 先生成一局（此时显示在开始界面后面）
    requestAnimationFrame(frame);
  </script>
</body>
</html>
